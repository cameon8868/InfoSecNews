<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подписка — InfoSecNews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
    <header class="site-header text-white py-4">
        <div class="container">
            <div class="row align-items-center">
            <div class="col-12 col-md-8">
                <h1 class="h3 mb-1">InfoSecNews</h1>
                <p class="mb-0 opacity-75">Новости информационной безопасности</p>
            </div>
            <div class="col-12 col-md-4 text-md-end mt-3 mt-md-0">
                <span class="badge bg-light text-primary">КР №2</span>
            </div>
            </div>
        </div>
    </header>
    
        <nav class="navbar navbar-expand-lg navbar-dark site-navbar">
            <div class="container">
                <a class="navbar-brand" href="index.html">InfoSecNews</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Переключить навигацию">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="index.html">Главная</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="news.html">Новости</a>
                    <li class="nav-item">
                    <a class="nav-link" href="order.html">Заявка</a>
                    </li>
                    <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Дополнительно</a>
                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" href="index.html#popular">Популярное</a></li>
                    </ul>
                    </li>
                </ul>
                </div>
            </div>
        </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h1 class="h4 mb-0">Форма подписки</h1>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info" role="alert">
                            Заполните форму, чтобы получать еженедельный дайджест угроз.
                        </div>
                        <form>
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label for="order-name" class="form-label">Имя *</label>
                                    <input id="order-name" type="text" class="form-control" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="order-email" class="form-label">E-mail *</label>
                                    <input id="order-email" type="email" class="form-control" required>
                                </div>
                                
                                <div class="col-12 col-md-6">
                                    <label for="order-phone" class="form-label">Телефон</label>
                                    <div class="input-group">
                                        <span class="input-group-text">+7</span>
                                        <input id="order-phone" type="tel" class="form-control" placeholder="900 000-00-00">
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="order-product" class="form-label">Тип подписки</label>
                                    <select id="order-product" class="form-select">
                                        <option selected>Выберите тариф</option>
                                        <option value="1">Базовый (раз в неделю)</option>
                                        <option value="2">Премиум (каждый день)</option>
                                    </select>
                                </div>

                                <div class="col-12">
                                    <div class="form-check">
                                        <input id="order-agree" class="form-check-input" type="checkbox" required>
                                        <label class="form-check-label" for="order-agree">
                                            Я согласен на обработку персональных данных *
                                        </label>
                                    </div>
                                </div>
                                
                                <div class="col-12 d-flex gap-2 mt-4">
                                    <button class="btn btn-primary" type="submit">Отправить</button>
                                    <button class="btn btn-outline-secondary" type="reset">Очистить</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row align-items-center g-3">
            <div class="col-12 col-md-6">
                <p class="mb-0">&copy; 2026 InfoSecNews. Учебный проект.</p>
            </div>
            <div class="col-12 col-md-6 text-md-end">
                <a class="text-white text-decoration-none me-3" href="news.html">Новости</a>
                <a class="text-white text-decoration-none" href="order.html">Заявка</a>
            </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
