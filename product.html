<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статья — InfoSecNews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
    <header class="site-header text-white py-4">
        <div class="container">
            <div class="row align-items-center">
            <div class="col-12 col-md-8">
                <h1 class="h3 mb-1">InfoSecNews</h1>
                <p class="mb-0 opacity-75">Новости информационной безопасности</p>
            </div>
            <div class="col-12 col-md-4 text-md-end mt-3 mt-md-0">
                <span class="badge bg-light text-primary">КР №2</span>
            </div>
            </div>
        </div>
    </header>
    
    <nav class="navbar navbar-expand-lg navbar-dark site-navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">InfoSecNews</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Переключить навигацию">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html">Главная</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="news.html">Новости</a>
                <li class="nav-item">
                <a class="nav-link" href="order.html">Заявка</a>
                </li>
                <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Дополнительно</a>
                <ul class="dropdown-menu dropdown-menu-dark">
                    <li><a class="dropdown-item" href="index.html#popular">Популярное</a></li>
                </ul>
                </li>
            </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                
                <!-- Дата -->
                <div class="text-muted mb-2" id="article-date"></div>

                <!-- Заголовок -->
                <h1 class="display-5 fw-bold mb-4 lh-sm" id="article-title"></h1>

                <!-- Текст статьи -->
                <div class="article-content fs-5 lh-lg text-light mb-5" id="article-content"></div>
                
                <hr class="my-5 border-secondary">

                <!-- Блок рекомендаций -->
                <section>
                    <h2 class="h3 mb-4">Читайте также</h2>
                    <!-- Контейнер для списка -->
                    <div class="d-flex flex-column gap-3" id="recommended-articles-container">
                        <!-- Сюда JS вставит ссылки-списки -->
                    </div>
                </section>

            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row align-items-center g-3">
            <div class="col-12 col-md-6">
                <p class="mb-0">&copy; 2026 InfoSecNews. Учебный проект.</p>
            </div>
            <div class="col-12 col-md-6 text-md-end">
                <a class="text-white text-decoration-none me-3" href="news.html">Новости</a>
                <a class="text-white text-decoration-none" href="order.html">Заявка</a>
            </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
